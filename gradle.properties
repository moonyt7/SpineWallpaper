# Project-wide Gradle settings.
# Enable AndroidX support for dependencies
android.useAndroidX=true

# Disable Jetifier since modern libraries are natively compiled for AndroidX
android.enableJetifier=false

# Non-transitive R classes for build optimization
android.nonTransitiveRClass=true

# Gradle JVM options
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Kotlin code style
kotlin.code.style=official