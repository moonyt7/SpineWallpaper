# Project-wide Gradle settings.
# Enable AndroidX support for dependencies
android.useAndroidX=true

# Disable Jetifier since modern libraries are natively compiled for AndroidX
android.enableJetifier=false

# Non-transitive R classes for build optimization
android.nonTransitiveRClass=true

# Gradle JVM options
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

# Limit parallel workers to avoid OOM on 8GB machines during dexing
org.gradle.workers.max=2

# Kotlin code style
kotlin.code.style=official